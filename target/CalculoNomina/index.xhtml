<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<h:head>
    <title>Gestor de Aspirantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
          rel="stylesheet" />
    <link href="https://unpkg.com/primeflex@3.3.1/primeflex.css" rel="stylesheet" />
    <style>
    .col-etiqueta {
        width: 180px;
        text-align: right;
        padding-right: 10px;
        vertical-align: middle;
    }
    .col-campo {
        width: 250px;
    }
    .col-mensaje {
        width: auto;
    }
</style>
</h:head>

<h:body>

    <!-- Growl configurado para mostrar también mensajes de validación -->
    <p:growl id="mensajes" showDetail="true" life="3000" globalOnly="false"/>

    <div class="container">
        <h1>Cálculo de Nómina</h1>

        <!-- Formulario independiente para crear/editar -->
        <h:form id="formEdicion">
            <!-- Panel de crear -->
          <p:fieldset legend="Crear Nuevo Usuario" rendered="#{usuarioBean.modoFormulario eq 'crear'}">
    <h:panelGrid columns="3" cellpadding="5" columnClasses="col-etiqueta, col-campo, col-mensaje">
        <p:outputLabel for="nombre" value="Nombre:" />
        <p:inputText id="nombre" value="#{usuarioBean.nuevoUsuario.nombre}" required="true" style="width:100%;"/>
        <p:message for="nombre"/>

        <p:outputLabel for="carrera" value="Carrera:" />
        <p:inputText id="carrera" value="#{usuarioBean.nuevoUsuario.carrera}" required="true" style="width:100%;"/>
        <p:message for="carrera"/>

        <p:outputLabel for="promedio" value="Promedio:" />
        <p:inputNumber id="promedio" value="#{usuarioBean.nuevoUsuario.promedioEstudiante}" 
                       decimalPlaces="2" minValue="0" required="true" style="width:100%;" />
        <p:message for="promedio"/>
    </h:panelGrid>
    <p:commandButton value="Guardar" action="#{usuarioBean.guardar()}" 
                     update="mensajes :formTabla:tabla-usuarios" icon="pi pi-save" style="margin-top:10px;"/>
</p:fieldset>

            <!-- Panel de editar -->
            <p:fieldset legend="Editar Usuario" rendered="#{usuarioBean.modoFormulario eq 'editar'}">
    <h:panelGrid columns="3" cellpadding="5" columnClasses="col-etiqueta, col-campo, col-mensaje">
        <p:outputLabel for="nombreEdit" value="Nombre:" />
        <p:inputText id="nombreEdit" value="#{usuarioBean.usuarioSeleccionado.nombre}" required="true" style="width:100%;"/>
        <p:message for="nombreEdit"/>

        <p:outputLabel for="carreraEdit" value="Carrera:" />
        <p:inputText id="carreraEdit" value="#{usuarioBean.usuarioSeleccionado.carrera}" required="true" style="width:100%;"/>
        <p:message for="carreraEdit"/>

        <p:outputLabel for="promedioEdit" value="Promedio:" />
        <p:inputNumber id="promedioEdit" value="#{usuarioBean.usuarioSeleccionado.promedioEstudiante}" 
                       decimalPlaces="2" minValue="0" required="true" style="width:100%;" />
        <p:message for="promedioEdit"/>
    </h:panelGrid>
    <p:commandButton value="Actualizar" action="#{usuarioBean.actualizar()}" 
                     update="mensajes :formTabla:tabla-usuarios" icon="pi pi-check" style="margin-top:10px;"/>
    <p:commandButton value="Cancelar" action="#{usuarioBean.prepararCrear()}" 
                     update=":formEdicion" icon="pi pi-times" style="margin-left:10px;"/>
</p:fieldset>
        </h:form>

        <!-- Formulario independiente para la tabla y sus acciones -->
        <h:form id="formTabla">
            <h2>Listado de Estudiantes</h2>
            <p:dataTable id="tabla-usuarios" value="#{usuarioBean.listaUsuarios}" var="usuario" 
                         paginator="true" rows="10" emptyMessage="No hay usuarios registrados"
                         styleClass="tabla-principal" sortMode="multiple">

                <p:column headerText="ID" sortBy="#{usuario.id}">
                    <h:outputText value="#{usuario.id}"/>
                </p:column>

                <p:column headerText="Nombre" sortBy="#{usuario.nombre}">
                    <h:outputText value="#{usuario.nombre}"/>
                </p:column>

                <p:column headerText="Carrera">
                    <h:outputText value="#{usuario.carrera}"/>
                </p:column>

                <!-- Columna del promedio: f:convertNumber bien cerrado -->
                <p:column headerText="Promedio del estudiante:" sortBy="#{usuario.promedioEstudiante}">
                    <h:outputText value="#{usuario.promedioEstudiante}">
                        <f:convertNumber pattern="#,##0.0" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Acciones" style="text-align:center">
                    <p:commandButton icon="pi pi-pencil" title="Editar" 
                                     action="#{usuarioBean.prepararEditar(usuario)}" 
                                     update=":formEdicion"/>
                    <p:commandButton icon="pi pi-trash" title="Eliminar" 
                                     action="#{usuarioBean.eliminar(usuario.id)}" 
                                     update="mensajes :formTabla:tabla-usuarios" style="margin-left:5px;"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </div>
</h:body>
</html>
